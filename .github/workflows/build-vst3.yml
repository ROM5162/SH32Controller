name: Build VST3

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    defaults:
      run:
        working-directory: SH32Controller

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.22.x'

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build VST3
        run: cmake --build build --config Release --target SH32Controller_VST3 --parallel 2

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: SH32-Controller-${{ matrix.os }}-vst3
          path: SH32Controller/build/SH32Controller_artefacts/Release/VST3/SH-32 Controller.vst3
          if-no-files-found: error
          compression-level: 0
